<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>M.E Search</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --text: #e0e0e0; --neon: #00ffcc; --neon-dim: rgba(0, 255, 204, 0.15); --border: rgba(0, 255, 204, 0.15); --glass: rgba(15, 20, 30, 0.6); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; position: relative; background-image: radial-gradient(circle at 15% 15%, rgba(0,255,204,0.06) 0%, transparent 45%), radial-gradient(circle at 85% 85%, rgba(0,255,204,0.06) 0%, transparent 45%), linear-gradient(180deg, #050505 0%, #08080f 100%); }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(5,5,10,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); z-index: 10;}
        .header-title .main { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, #fff 0%, var(--neon) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-title .sub { font-size: 11px; color: var(--neon); font-family: 'Space Mono', monospace; opacity: 0.7; }
        
        .chat-wrapper { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .chat-container { width: 100%; max-width: 820px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .message-row { display: flex; flex-direction: column; width: 100%; }
        .message-row.user { align-items: flex-start; }
        .message-row.ai { align-items: flex-end; }
        .message-header { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 11px; margin-bottom: 6px; color: var(--neon); font-family: 'Space Mono', monospace; }
        
        .message-content { font-size: 15px; line-height: 1.8; padding: 15px 20px; border-radius: 16px; max-width: 92%; word-wrap: break-word; background: var(--glass); border: 1px solid var(--border); }
        .message-row.user .message-content { background: rgba(0,255,204,0.1); border-color: rgba(0,255,204,0.3); color: #fff; }
        
        /* تنسيق النصوص واللينكات */
        .message-content h3 { color: var(--neon); margin-bottom: 10px; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .message-content strong { color: #fff; }
        .message-content a { color: var(--neon); text-decoration: underline; word-break: break-all; display: block; margin-top: 5px; }
        .message-content p { margin-bottom: 10px; }

        /* زرار نسخ التقرير */
        .copy-report-btn { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 5px 12px; border-radius: 10px; font-size: 12px; cursor: pointer; margin-bottom: 10px; align-self: flex-end; transition: 0.3s;}
        .copy-report-btn:active { background: var(--neon); color: #000; }

        .input-container { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: linear-gradient(180deg, transparent, #000 70%); display: flex; justify-content: center; z-index: 10; }
        .input-box-wrapper { width: 100%; max-width: 820px; display: flex; align-items: center; gap: 8px; background: rgba(15, 20, 30, 0.9); border-radius: 15px; padding: 6px; border: 1px solid var(--border); }
        input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; padding: 10px; outline: none; }
        .send-btn { background: var(--neon); color: #000; border: none; width: 45px; height: 45px; border-radius: 10px; font-size: 20px; font-weight: bold; }
        
        #update-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--neon); color: #000; padding: 12px 20px; border-radius: 0 0 15px 15px; font-weight: bold; z-index: 9999; transition: top 0.5s ease; display: flex; align-items: center; gap: 10px; }
        #update-toast.show { top: 0; }
        #update-toast button { background: #000; color: var(--neon); border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>
    <div id="update-toast"><span>🚀 يوجد تحديث جديد!</span><button onclick="applyUpdate()">تحديث الآن</button></div>
    
    <div class="header">
        <div class="header-title">
            <div class="main">M.E SEARCH</div>
            <div class="sub">DEEP WEB INTELLIGENCE</div>
        </div>
        <button class="icon-btn" onclick="newChat()" style="background:transparent; border:1px solid var(--neon); color:var(--neon); padding:5px 10px; border-radius:10px;">+ NEW</button>
    </div>
    
    <div class="chat-wrapper" id="chat-wrapper">
        <div class="chat-container" id="chat-container"></div>
    </div>
    
    <div class="input-container">
        <div class="input-box-wrapper">
            <input type="text" id="prompt" placeholder="ابحث عن أي شيء..." onkeypress="if(event.key === 'Enter') askAI()">
            <button class="send-btn" onclick="askAI()">↑</button>
        </div>
    </div>

    <script>
        let newWorker;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            document.getElementById('update-toast').classList.add('show');
                        }
                    });
                });
            });
        }
        function applyUpdate() { if (newWorker) newWorker.postMessage({ action: 'skipWaiting' }); window.location.reload(); }

        let chatHistory = JSON.parse(localStorage.getItem('m.e_history')) || [];
        function loadHistory() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            if(chatHistory.length === 0) {
                container.innerHTML = `<div class="message-row ai"><div class="message-header">SYSTEM READY</div><div class="message-content">مرحباً يا محمد 👋<br>أنا محرك البحث الخاص بك. اكتب أي حاجة وسأجلب لك المعلومات واللينكات.</div></div>`;
            }
            chatHistory.forEach((msg, i) => {
                container.innerHTML += `
                    <div class="message-row ${msg.role === 'user' ? 'user' : 'ai'}">
                        <div class="message-header">${msg.role === 'user' ? 'USER INPUT' : 'SEARCH REPORT'}</div>
                        ${msg.role === 'ai' ? `<button class="copy-report-btn" onclick="copyReport(${i})">📋 نسخ التقرير كامل</button>` : ''}
                        <div class="message-content">${formatText(msg.content)}</div>
                    </div>`;
            });
            document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;
        }
        loadHistory();

        function newChat() { chatHistory = []; localStorage.removeItem('m.e_history'); loadHistory(); }
        
        function copyReport(index) {
            navigator.clipboard.writeText(chatHistory[index].content).then(() => alert('تم نسخ التقرير!'));
        }

        function formatText(text) {
            if(!text) return '';
            // تحويل اللينكات اللي شكل [title](url) أو http://
            let formatted = text.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
            formatted = formatted.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
            // تحويل العناوين
            formatted = formatted.replace(/###(.*?)(?=\n|$)/g, '<h3>$1</h3>');
            // تحويل العريض
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // المسافات
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        async function askAI() {
            const promptInput = document.getElementById('prompt');
            const prompt = promptInput.value.trim();
            if(!prompt) return;

            document.getElementById('chat-container').innerHTML += `<div class="message-row user"><div class="message-header">USER INPUT</div><div class="message-content">${prompt}</div></div>`;
            promptInput.value = '';

            const loadingId = 'loading-' + Date.now();
            document.getElementById('chat-container').innerHTML += `<div class="message-row ai" id="${loadingId}"><div class="message-header">SEARCHING...</div><div class="message-content">⏳ جاري البحث...</div></div>`;
            document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;

            try {
                const res = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
                const data = await res.json();
                
                document.getElementById(loadingId).remove();
                chatHistory.push({ role: 'user', content: prompt });
                chatHistory.push({ role: 'assistant', content: data.final });
                localStorage.setItem('m.e_history', JSON.stringify(chatHistory));
                
                loadHistory(); // إعادة تحميل الشات عشان الزرار يظهر
            } catch (error) {
                document.getElementById(loadingId).remove();
                alert('السيرفر مش شغال أو لسه بيصحى. استنى شوية وجرب.');
            }
        }
    </script>
</body>
</html>
