<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>M.E Search</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --text: #e0e0e0; --neon: #00ffcc; --border: rgba(0, 255, 204, 0.2); --glass: rgba(15, 20, 30, 0.8); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(5,5,10,0.9); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;}
        .header-title .main { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, #fff, var(--neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .chat-wrapper { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .chat-container { width: 100%; max-width: 820px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .message-row { display: flex; flex-direction: column; width: 100%; }
        .message-row.user { align-items: flex-start; }
        .message-row.ai { align-items: flex-end; }
        
        .message-content { font-size: 15px; line-height: 1.8; padding: 15px 20px; border-radius: 16px; max-width: 95%; word-wrap: break-word; background: var(--glass); border: 1px solid var(--border); position: relative;}
        .message-row.user .message-content { background: rgba(0,255,204,0.15); border-color: var(--neon); color: #fff; }
        
        /* تنسيق الكلام */
        .message-content h3 { color: var(--neon); margin: 10px 0; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .message-content strong { color: #fff; }
        .message-content ul { padding-right: 15px; margin: 10px 0; }
        .message-content li { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #333; color: #ccc; }
        .message-content p { margin-bottom: 10px; }

        /* أزرار اللينكات */
        .link-btn { display: inline-flex; align-items: center; background: rgba(0,255,204,0.1); border: 1px solid var(--neon); color: var(--neon); padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; margin: 5px 0; word-break: break-all; width: 100%; justify-content: space-between;}
        .link-btn:hover { background: var(--neon); color: #000; }

        /* زرار نسخ التقرير */
        .copy-btn { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 5px 15px; border-radius: 20px; font-size: 12px; cursor: pointer; margin-top: 10px; display: block; width: fit-content; align-self: flex-end;}
        .copy-btn:active { background: var(--neon); color: #000; }

        .input-container { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: linear-gradient(180deg, transparent, #000 80%); display: flex; justify-content: center; z-index: 100;}
        .input-box-wrapper { width: 100%; max-width: 820px; display: flex; align-items: center; gap: 8px; background: rgba(20, 25, 35, 0.95); border-radius: 15px; padding: 5px; border: 1px solid var(--border); }
        input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; padding: 12px; outline: none; }
        .send-btn { background: var(--neon); color: #000; border: none; width: 45px; height: 45px; border-radius: 12px; font-size: 20px; font-weight: bold; }

        #update-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--neon); color: #000; padding: 12px 20px; border-radius: 0 0 15px 15px; font-weight: bold; z-index: 9999; transition: top 0.5s ease; display: flex; align-items: center; gap: 10px; }
        #update-toast.show { top: 0; }
    </style>
</head>
<body>
    <div id="update-toast"><span>🚀 يوجد تحديث!</span><button onclick="applyUpdate()">تحديث الآن</button></div>
    
    <div class="header">
        <div class="header-title"><div class="main">M.E SEARCH</div></div>
        <button onclick="newChat()" style="background:transparent; border:1px solid var(--neon); color:var(--neon); padding:6px 12px; border-radius:10px; font-size:13px;">+ NEW</button>
    </div>
    
    <div class="chat-wrapper" id="chat-wrapper">
        <div class="chat-container" id="chat-container"></div>
    </div>
    
    <div class="input-container">
        <div class="input-box-wrapper">
            <input type="text" id="prompt" placeholder="ابحث عن أي شيء..." onkeypress="if(event.key === 'Enter') askAI()">
            <button class="send-btn" onclick="askAI()">↑</button>
        </div>
    </div>

    <script>
        let newWorker;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            document.getElementById('update-toast').classList.add('show');
                        }
                    });
                });
            });
        }
        function applyUpdate() { if (newWorker) newWorker.postMessage({ action: 'skipWaiting' }); window.location.reload(); }

        let chatHistory = JSON.parse(localStorage.getItem('m.e_history')) || [];
        
        // دالة التنسيق القوية اللي بتعمل المربعات واللينكات
        function formatText(text) {
            let html = text;

            // 1. تحويل اللينكات اللي شكل [title](url) لأزرار
            html = html.replace(/\[(.*?)\]\((.*?)\)/g, function(match, title, url) {
                return `<a href="${url}" target="_blank" class="link-btn">🔗 ${title} <span>↗</span></a>`;
            });

            // 2. تحويل أي لينك عادي (http) لزرار
            html = html.replace(/(https?:\/\/[^\s]+)/g, function(url) {
                return `<a href="${url}" target="_blank" class="link-btn">🔗 ${url} <span>↗</span></a>`;
            });

            // 3. تنسيق العناوين
            html = html.replace(/###(.*?)(?=\n|$)/g, '<h3>$1</h3>');
            
            // 4. تنسيق الخط العريض
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // 5. تحويل النقاط (-) لقوائم
            html = html.replace(/^-\s(.*?)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*?<\/li>)/gs, '<ul>$1</ul>');

            // 6. تحويل السطور الجديدة لمسافات
            html = html.replace(/\n/g, '<br>');

            return html;
        }

        function loadHistory() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            if(chatHistory.length === 0) {
                container.innerHTML = `<div class="message-row ai"><div class="message-content">مرحباً يا محمد 👋<br>أنا محرك البحث الخاص بك. اكتب أي حاجة وسأجلب لك المعلومات واللينكات منسقة زي ما بتحب.</div></div>`;
            }
            chatHistory.forEach((msg, index) => {
                let formatted = formatText(msg.content);
                let copyBtn = msg.role === 'ai' ? `<button class="copy-btn" onclick="copyText(${index})">📋 نسخ التقرير كامل</button>` : '';
                
                container.innerHTML += `
                    <div class="message-row ${msg.role === 'user' ? 'user' : 'ai'}">
                        <div class="message-content">${formatted}</div>
                        ${copyBtn}
                    </div>`;
            });
            document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;
        }
        loadHistory();

        function copyText(index) {
            navigator.clipboard.writeText(chatHistory[index].content).then(() => {
                alert('تم نسخ التقرير بالكامل!');
            });
        }

        function newChat() { chatHistory = []; localStorage.removeItem('m.e_history'); loadHistory(); }

        async function askAI() {
            const promptInput = document.getElementById('prompt');
            const prompt = promptInput.value.trim();
            if(!prompt) return;

            document.getElementById('chat-container').innerHTML += `<div class="message-row user"><div class="message-content">${prompt}</div></div>`;
            promptInput.value = '';

            const loadingId = 'loading-' + Date.now();
            document.getElementById('chat-container').innerHTML += `<div class="message-row ai" id="${loadingId}"><div class="message-content">⏳ جاري البحث...</div></div>`;
            document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;

            try {
                const res = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
                const data = await res.json();
                
                document.getElementById(loadingId).remove();
                chatHistory.push({ role: 'user', content: prompt });
                chatHistory.push({ role: 'assistant', content: data.final });
                localStorage.setItem('m.e_history', JSON.stringify(chatHistory));
                
                loadHistory();
            } catch (error) {
                document.getElementById(loadingId).remove();
                alert('السيرفر لسه بيصحى. استنى شوية وجرب.');
            }
        }
    </script>
</body>
</html>
