<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>M.E Assistant</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --text: #e0e0e0; --neon: #00ffcc; --border: rgba(0, 255, 204, 0.2); --glass: rgba(15, 20, 30, 0.8); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden;}
        
        /* الهيدر */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(5,5,10,0.9); border-bottom: 1px solid var(--border); z-index: 100; backdrop-filter: blur(10px);}
        .header-title .main { font-size: 20px; font-weight: 900; background: linear-gradient(90deg, #fff, var(--neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; gap: 10px; }
        .action-btn { background: transparent; border: 1px solid var(--border); color: var(--neon); padding: 8px 12px; border-radius: 10px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px;}
        
        /* القائمة الجانبية (المشاريع/الشاتات) */
        .sidebar { position: fixed; top: 0; right: -300px; width: 280px; height: 100dvh; background: #0a0a0f; border-left: 1px solid var(--border); z-index: 1000; transition: right 0.3s ease; display: flex; flex-direction: column; box-shadow: -5px 0 20px rgba(0,0,0,0.5);}
        .sidebar.open { right: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;}
        .sidebar-header h3 { color: var(--neon); font-size: 18px; }
        .close-sidebar { background: transparent; border: none; color: #fff; font-size: 24px; cursor: pointer;}
        .chats-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;}
        .chat-item { padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid #222; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s;}
        .chat-item:hover, .chat-item.active { background: rgba(0,255,204,0.1); border-color: var(--neon); }
        .chat-item-title { font-size: 14px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;}
        .delete-chat-btn { background: transparent; border: none; color: #ff4444; font-size: 16px; cursor: pointer; padding: 5px;}
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999; display: none; backdrop-filter: blur(2px);}
        .overlay.show { display: block; }

        /* الشات */
        .chat-wrapper { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .chat-container { width: 100%; max-width: 820px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .message-row { display: flex; flex-direction: column; width: 100%; animation: slideUp 0.3s ease-out; }
        .message-row.user { align-items: flex-start; }
        .message-row.ai { align-items: flex-end; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .message-content { font-size: 15px; line-height: 1.8; padding: 15px 20px; border-radius: 16px; max-width: 95%; word-wrap: break-word; background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .message-row.user .message-content { background: rgba(0,255,204,0.15); border-color: var(--neon); color: #fff; }
        
        .message-content h3 { color: var(--neon); margin: 15px 0 10px; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .message-content strong { color: #fff; font-weight: 700; }
        .message-content ul { padding-right: 20px; margin: 10px 0; }
        .message-content li { margin-bottom: 8px; color: #ccc; }
        .message-content p { margin-bottom: 10px; }
        .message-content img { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); }
        
        .link-btn { display: flex; align-items: center; justify-content: space-between; background: rgba(0,255,204,0.1); border: 1px solid var(--neon); color: var(--neon); padding: 10px 15px; border-radius: 10px; text-decoration: none; font-size: 13px; margin: 8px 0; word-break: break-all; transition: 0.3s; }

        .input-container { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: linear-gradient(180deg, transparent, #000 80%); display: flex; justify-content: center; z-index: 100;}
        .input-box-wrapper { width: 100%; max-width: 820px; display: flex; align-items: center; gap: 8px; background: rgba(20, 25, 35, 0.95); border-radius: 15px; padding: 5px 10px; border: 1px solid var(--border); }
        input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; padding: 12px; outline: none; }
        .icon-btn { background: transparent; border: none; color: #888; font-size: 22px; cursor: pointer; padding: 5px; }
        .send-btn { background: var(--neon); color: #000; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;}
        .speak-btn { background: transparent; border: 1px solid var(--border); color: var(--neon); width: 35px; height: 35px; border-radius: 50%; font-size: 16px; cursor: pointer; margin-top: 10px; align-self: flex-end; display: flex; align-items: center; justify-content: center;}

        #update-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--neon); color: #000; padding: 12px 20px; border-radius: 0 0 15px 15px; font-weight: bold; z-index: 9999; transition: top 0.5s ease; display: flex; align-items: center; gap: 10px; }
        #update-toast.show { top: 0; }
    </style>
</head>
<body>
    <!-- القائمة الجانبية -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>مشاريعي (الشاتات)</h3>
            <button class="close-sidebar" onclick="toggleSidebar()">×</button>
        </div>
        <button onclick="createNewChat()" style="margin: 15px; padding: 12px; background: var(--neon); color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-family: 'Cairo';">+ شات جديد</button>
        <div class="chats-list" id="chats-list"></div>
    </div>

    <div id="update-toast"><span>🚀 يوجد تحديث!</span><button onclick="applyUpdate()">تحديث</button></div>
    
    <div class="header">
        <button class="action-btn" onclick="toggleSidebar()">☰ القائمة</button>
        <div class="header-title"><div class="main">M.E ASSISTANT</div></div>
        <button class="action-btn" onclick="createNewChat()">+ جديد</button>
    </div>
    
    <div class="chat-wrapper" id="chat-wrapper">
        <div class="chat-container" id="chat-container"></div>
    </div>
    
    <div class="input-container">
        <div class="input-box-wrapper">
            <button class="icon-btn" onclick="startDictation()">🎤</button>
            <input type="text" id="prompt" placeholder="اسأل عن أي حاجة..." onkeypress="if(event.key === 'Enter') askAI()">
            <button class="send-btn" onclick="askAI()">↑</button>
        </div>
    </div>

    <script>
        const renderer = new marked.Renderer();
        renderer.link = function(href, title, text) {
            return `<a href="${href}" target="_blank" class="link-btn">🔗 ${text} <span>↗</span></a>`;
        };
        marked.setOptions({ renderer: renderer, breaks: true });

        // نظام التخزين (Sessions)
        let sessions = JSON.parse(localStorage.getItem('m.e_sessions')) || [];
        let currentSessionId = localStorage.getItem('m.e_current_session');
        
        // لو مفيش شاتات خالص، نعمل واحد
        if (sessions.length === 0) {
            createNewChat();
        } else if (!currentSessionId || !sessions.find(s => s.id === currentSessionId)) {
            currentSessionId = sessions[0].id;
        }

        function saveSessions() {
            localStorage.setItem('m.e_sessions', JSON.stringify(sessions));
            localStorage.setItem('m.e_current_session', currentSessionId);
        }

        function getCurrentSession() {
            return sessions.find(s => s.id === currentSessionId);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
            if(document.getElementById('sidebar').classList.contains('open')) {
                renderChatsList();
            }
        }

        function renderChatsList() {
            const list = document.getElementById('chats-list');
            list.innerHTML = '';
            // بنعرض الشاتات من الأحدث للأقدم
            [...sessions].reverse().forEach(session => {
                let item = document.createElement('div');
                item.className = `chat-item ${session.id === currentSessionId ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="chat-item-title">${session.title || 'شات جديد'}</div>
                    <button class="delete-chat-btn" onclick="deleteChat(event, '${session.id}')">🗑️</button>
                `;
                item.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') {
                        switchChat(session.id);
                    }
                };
                list.appendChild(item);
            });
        }

        function createNewChat() {
            const newId = 'chat_' + Date.now();
            const newSession = { id: newId, title: 'شات جديد', messages: [] };
            sessions.push(newSession);
            currentSessionId = newId;
            saveSessions();
            loadChat();
            if(document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
        }

        function switchChat(id) {
            currentSessionId = id;
            saveSessions();
            loadChat();
            toggleSidebar();
        }

        function deleteChat(event, id) {
            event.stopPropagation();
            if(confirm('متأكد إنك عايز تمسح الشات ده؟')) {
                sessions = sessions.filter(s => s.id !== id);
                if (currentSessionId === id) {
                    if (sessions.length > 0) currentSessionId = sessions[sessions.length - 1].id;
                    else { createNewChat(); return; }
                }
                saveSessions();
                renderChatsList();
                loadChat();
            }
        }

        function loadChat() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            const session = getCurrentSession();
            
            if (!session || session.messages.length === 0) {
                container.innerHTML = `<div class="message-row ai"><div class="message-content">أهلاً بك يا محمد 👋<br>أنا مساعدك. اسألني أي حاجة أو اطلب صورة.</div></div>`;
                return;
            }
            
            session.messages.forEach((msg, index) => {
                let htmlContent = marked.parse(msg.content);
                let speakBtn = msg.role === 'ai' ? `<button class="speak-btn" onclick="speakText('${msg.content.replace(/'/g, "\\'")}')">🔊</button>` : '';
                container.innerHTML += `
                    <div class="message-row ${msg.role === 'user' ? 'user' : 'ai'}">
                        <div class="message-content" id="msg-${index}">${htmlContent}</div>
                        ${speakBtn}
                    </div>`;
            });
            document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;
        }

        function startDictation() {
            if (window.hasOwnProperty('webkitSpeechRecognition')) {
                var recognition = new webkitSpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = "ar-EG";
                recognition.start();
                recognition.onresult = function(e) {
                    document.getElementById('prompt').value = e.results[0][0].transcript;
                    recognition.stop();
                    askAI();
                };
            } else { alert('متصفحك مش بيدعم المايك.'); }
        }

        function speakText(text) {
            let cleanText = text.replace(/[*#_`\-]/g, '').replace(/\[.*?\]\(.*?\)/g, '').replace(/https?:\/\/[^\s]+/g, '');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var msg = new SpeechSynthesisUtterance(cleanText);
                msg.lang = 'ar-EG';
                window.speechSynthesis.speak(msg);
            }
        }

        async function typeWriter(element, text, speed = 10) {
            element.innerHTML = '';
            const lines = text.split('\n');
            let currentText = '';
            for (let i = 0; i < lines.length; i++) {
                currentText += lines[i] + '\n';
                element.innerHTML = marked.parse(currentText);
                document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;
                await new Promise(r => setTimeout(r, speed));
            }
            element.innerHTML = marked.parse(text);
        }

        async function askAI() {
            const promptInput = document.getElementById('prompt');
            const prompt = promptInput.value.trim();
            if(!prompt) return;

            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            const session = getCurrentSession();
            // تحديث عنوان الشات لو ده أول سؤال
            if (session.messages.length === 0) {
                session.title = prompt.substring(0, 25) + (prompt.length > 25 ? '...' : '');
                saveSessions();
            }

            session.messages.push({ role: 'user', content: prompt });
            saveSessions();
            
            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML += `<div class="message-row user"><div class="message-content">${prompt}</div></div>`;
            promptInput.value = '';
            document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `<div class="message-row ai" id="${loadingId}"><div class="message-content">⏳ جاري التفكير...</div></div>`;
            document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;

            try {
                const res = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, history: session.messages }) });
                const data = await res.json();
                
                document.getElementById(loadingId).remove();
                session.messages.push({ role: 'assistant', content: data.final });
                saveSessions();
                
                const aiMsgId = 'ai-' + Date.now();
                chatContainer.innerHTML += `
                    <div class="message-row ai">
                        <div class="message-content" id="${aiMsgId}"></div>
                        <button class="speak-btn" onclick="speakText('${data.final.replace(/'/g, "\\'")}')">🔊</button>
                    </div>`;
                
                await typeWriter(document.getElementById(aiMsgId), data.final, 10);

            } catch (error) {
                document.getElementById('loadingId').remove();
                alert('السيرفر لسه بيصحى. استنى شوية وجرب.');
            }
        }
    </script>
</body>
</html>
