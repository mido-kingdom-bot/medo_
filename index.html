<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.E ASSISTANT</title>
    <style>
        :root { --bg: #0b1110; --header: #0e1513; --primary: #00ffcc; --text: #ffffff; --bot-bg: #111a18; --user-bg: #0e3b32; }
        body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* شاشة تسجيل الدخول */
        #auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; box-sizing: border-box; }
        #auth-screen h1 { color: var(--primary); margin-bottom: 30px; }
        .auth-box { background: var(--header); padding: 25px; border-radius: 15px; border: 1px solid var(--primary); width: 100%; max-width: 350px; text-align: center; }
        .auth-box input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #1f3632; background: var(--bot-bg); color: #fff; outline: none; text-align: center; }
        .auth-box button { width: 100%; padding: 12px; margin-top: 15px; background: var(--primary); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .auth-box p { font-size: 14px; color: #aaa; margin-top: 15px; cursor: pointer; }
        
        /* شاشة الشات */
        #chat-screen { display: none; flex-direction: column; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background-color: var(--header); border-bottom: 1px solid #1a2b28; }
        .header h1 { margin: 0; font-size: 18px; color: var(--primary); }
        .header button { background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 20px; }
        .message { margin-bottom: 15px; padding: 12px 15px; border-radius: 12px; line-height: 1.6; font-size: 15px; word-wrap: break-word; }
        .message.user { background-color: var(--user-bg); border: 1px solid var(--primary); margin-left: 15%; text-align: left; }
        .message.bot { background-color: var(--bot-bg); border: 1px solid #1f3632; margin-right: 15%; }
        .message a { color: var(--primary); text-decoration: none; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        
        .input-area { background-color: var(--header); padding: 10px 15px; border-top: 1px solid #1a2b28; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 12px 15px; border-radius: 20px; border: 1px solid #1f3632; background-color: var(--bot-bg); color: var(--text); outline: none; font-family: inherit; }
        .input-area button { background-color: var(--primary); color: #000; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen">
        <h1>M.E ASSISTANT</h1>
        <div class="auth-box">
            <input type="text" id="username" placeholder="اسمك الجديد (مثال: Mido)">
            <input type="password" id="password" placeholder="كلمة السر">
            <button onclick="login()">تسجيل الدخول</button>
            <button onclick="register()" style="background: transparent; border: 1px solid var(--primary); color: var(--primary); margin-top: 10px;">إنشاء حساب جديد</button>
            <p id="auth-msg" style="color: #ff6b6b;"></p>
        </div>
    </div>

    <!-- شاشة الشات -->
    <div id="chat-screen">
        <div class="header">
            <button onclick="logout()">خروج</button>
            <h1>M.E ASSISTANT</h1>
            <button onclick="location.reload()">تحديث</button>
        </div>
        <div id="chat-container">
            <!-- الرسايل هتظهر هنا -->
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="اسأل عن أي حاجة..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">⬆</button>
        </div>
    </div>

    <script>
        // تسجيل الدخول
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const res = await fetch('/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: user, password: pass}) });
            const data = await res.json();
            
            if (data.success) { showChat(user); } 
            else { document.getElementById('auth-msg').innerText = data.message; }
        }

        // إنشاء حساب
        async function register() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if(!user || !pass) return document.getElementById('auth-msg').innerText = "اكتب اسم وباسورد الأول!";
            
            const res = await fetch('/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: user, password: pass}) });
            const data = await res.json();
            
            if (data.success) { showChat(user); } 
            else { document.getElementById('auth-msg').innerText = data.message; }
        }

        // إظهار الشات بعد الدخول
        function showChat(username) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            // رسالة ترحيب باسم الشخص
            document.getElementById('chat-container').innerHTML = `<div class="message bot">أهلاً بيك يا <b>${username}</b> 👋<br>أنا مساعدك الذكي، جاهز نبدأ؟</div>`;
        }

        // خروج
        async function logout() {
            await fetch('/logout');
            location.reload();
        }

        // إرسال رسالة
        async function sendMessage() {
            const text = document.getElementById('user-input').value.trim();
            if (!text) return;

            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML += `<div class="message user">${text}</div>`;
            document.getElementById('user-input').value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `<div class="message bot" id="${loadingId}">جاري البحث يا ${document.getElementById('username').value}... ⏳</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `<div class="message bot">${data.final}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                document.getElementById(loadingId).innerText = "❌ السيرفر وقع أو في مشكلة في الاتصال.";
            }
        }
    </script>
</body>
</html>
