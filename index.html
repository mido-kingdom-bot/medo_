<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.E Assistant</title>
    <style>
        :root { --bg: #0a0a0a; --text: #ffffff; --primary: #00ffcc; --panel: #161b18; --border: #2a3b32; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
        
        /* شاشة الترحيب */
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .boxes-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .neon-box { background: transparent; border: 2px solid var(--primary); color: var(--primary); padding: 20px; font-size: 24px; font-weight: bold; border-radius: 20px; box-shadow: 0 0 20px var(--primary); cursor: pointer; text-align: center; width: 130px; height: 130px; display: flex; flex-direction: column; justify-content: center; transition: 0.3s; }
        .neon-box:hover { transform: scale(1.05); box-shadow: 0 0 40px var(--primary); }
        .subtitle { font-size: 13px; color: #ccc; margin-top: 8px; font-weight: normal; }

        /* لوحة التحكم */
        #dashboard-screen { display: none; flex-direction: column; height: 100%; padding: 20px; overflow-y: auto; }
        .dash-title { text-align: center; color: var(--primary); font-size: 22px; margin-bottom: 25px; margin-top: 10px; }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .tool-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .tool-card:hover { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        .tool-icon { font-size: 32px; margin-bottom: 10px; }
        .tool-name { font-size: 15px; font-weight: bold; }

        /* الشات */
        #main-screen { display: none; height: 100%; position: relative; }
        .header { background: var(--panel); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
        .header h2 { color: var(--primary); font-size: 18px; }
        #chat-container { height: 100%; overflow-y: auto; padding: 15px; padding-top: 70px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 15px; border-radius: 10px; font-size: 15px; max-width: 85%; word-wrap: break-word; line-height: 1.6; }
        .message.user { background: var(--primary); color: #000; margin-left: auto; border-bottom-right-radius: 0; }
        .message.bot { background: var(--panel); border: 1px solid var(--border); margin-right: auto; border-bottom-left-radius: 0; }
        
        .input-area { position: absolute; bottom: 0; left: 0; right: 0; background: var(--panel); padding: 10px 15px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
        .input-area input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid var(--border); background: #000; color: #fff; outline: none; }
        .input-area button { background: var(--primary); color: #000; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <!-- 1. الترحيب -->
    <div id="splash-screen">
        <div class="boxes-container">
            <div class="neon-box" onclick="enterApp('control')">تحكم كامل<div class="subtitle">أدوات وتبنيد</div></div>
            <div class="neon-box" onclick="enterApp('search')">بحث شامل<div class="subtitle">محرك بحث</div></div>
        </div>
    </div>

    <!-- 2. لوحة التحكم (محدثة) -->
    <div id="dashboard-screen">
        <h2 class="dash-title">مركز العمليات 🛡️</h2>
        <div class="tools-grid">
            <div class="tool-card" onclick="selectTool('search_engine', 'محرك بحث شامل')"><div class="tool-icon">🌐</div><div class="tool-name">بحث شامل</div></div>
            <div class="tool-card" onclick="selectTool('ai_brain', 'العقل الذكي')"><div class="tool-icon">🧠</div><div class="tool-name">العقل الذكي</div></div>
            <div class="tool-card" onclick="selectTool('execution', 'تنفيذ أدوات')"><div class="tool-icon">⚡</div><div class="tool-name">تنفيذ أدوات</div></div>
            <div class="tool-card" onclick="selectTool('code_gen', 'مولد أكواد')"><div class="tool-icon">💻</div><div class="tool-name">مولد أكواد</div></div>
        </div>
    </div>

    <!-- 3. الشات -->
    <div id="main-screen">
        <div class="header">
            <button onclick="goToDashboard()" style="background:none; border:none; color:var(--primary); font-size:20px;">⬅</button>
            <h2 id="chat-title">M.E</h2>
            <button onclick="location.reload()" style="background:none; border:none; color:#ff4c4c;">خروج</button>
        </div>
        <div id="chat-container"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="اكتب هنا..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">⬆</button>
        </div>
    </div>

    <script>
        let activeTool = "";
        let chatHistory = [];

        function enterApp(type) {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                if (type === 'control') {
                    document.getElementById('dashboard-screen').style.display = 'flex';
                } else if (type === 'search') {
                    document.getElementById('dashboard-screen').style.display = 'none';
                    document.getElementById('main-screen').style.display = 'block';
                    selectTool('search_engine', 'محرك بحث شامل');
                }
            }, 500);
        }

        function goToDashboard() { 
            document.getElementById('main-screen').style.display = 'none'; 
            document.getElementById('dashboard-screen').style.display = 'flex'; 
        }

        function selectTool(toolId, toolName) {
            activeTool = toolId;
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('chat-title').innerText = toolName;
            
            let inputField = document.getElementById('user-input');
            if(toolId === 'search_engine') inputField.placeholder = "ابحث في الإنترنت عن أي حاجة...";
            else if(toolId === 'execution') inputField.placeholder = "نفذ nmap على 8.8.8.8";
            else inputField.placeholder = "اسأل عن أي حاجة...";

            document.getElementById('chat-container').innerHTML = '';
            chatHistory = [];
            addMsg(`أهلاً بك في **${toolName}**.`, 'bot');
        }

        function addMsg(text, sender) {
            let chat = document.getElementById('chat-container');
            let msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            let formatted = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre style="background:#000; padding:10px; border-radius:5px; direction:ltr; text-align:left; overflow-x:auto; color:var(--primary);">$1</pre>');
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
            msgDiv.innerHTML = formatted;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            let input = document.getElementById('user-input');
            let text = input.value.trim(); if(!text) return;
            addMsg(text, 'user'); input.value = '';
            chatHistory.push(text);

            try {
                const res = await fetch('/ask', { 
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ prompt: text, user: "صديقي", tool: activeTool, history: chatHistory }) 
                });
                const data = await res.json();
                addMsg(data.final, 'bot');
            } catch(e) { addMsg("السيرفر وقع.", 'bot'); }
        }
    </script>
</body>
</html>
