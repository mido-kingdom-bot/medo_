<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>M.E Search</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- مكتبة Markdown الجبارة -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --text: #e0e0e0; --neon: #00ffcc; --border: rgba(0, 255, 204, 0.2); --glass: rgba(15, 20, 30, 0.8); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; background-image: radial-gradient(circle at 15% 15%, rgba(0,255,204,0.05) 0%, transparent 40%), radial-gradient(circle at 85% 85%, rgba(0,255,204,0.05) 0%, transparent 40%); }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(5,5,10,0.9); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);}
        .header-title .main { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, #fff, var(--neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .chat-wrapper { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .chat-container { width: 100%; max-width: 820px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .message-row { display: flex; flex-direction: column; width: 100%; animation: slideUp 0.3s ease-out; }
        .message-row.user { align-items: flex-start; }
        .message-row.ai { align-items: flex-end; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .message-content { font-size: 15px; line-height: 1.8; padding: 15px 20px; border-radius: 16px; max-width: 95%; word-wrap: break-word; background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .message-row.user .message-content { background: rgba(0,255,204,0.15); border-color: var(--neon); color: #fff; }
        
        /* تنسيق Markdown */
        .message-content h3 { color: var(--neon); margin: 15px 0 10px; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .message-content strong { color: #fff; font-weight: 700; }
        .message-content ul { padding-right: 20px; margin: 10px 0; }
        .message-content li { margin-bottom: 8px; color: #ccc; }
        .message-content p { margin-bottom: 10px; }
        
        /* زرار اللينك الخارق */
        .link-btn { display: flex; align-items: center; justify-content: space-between; background: rgba(0,255,204,0.1); border: 1px solid var(--neon); color: var(--neon); padding: 10px 15px; border-radius: 10px; text-decoration: none; font-size: 13px; margin: 8px 0; word-break: break-all; transition: 0.3s; }
        .link-btn:hover, .link-btn:active { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }

        /* زرار نسخ */
        .copy-btn { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 6px 15px; border-radius: 20px; font-size: 12px; cursor: pointer; margin-top: 10px; align-self: flex-end; transition: 0.3s; display: flex; align-items: center; gap: 5px;}
        .copy-btn:active { background: var(--neon); color: #000; }

        .input-container { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: linear-gradient(180deg, transparent, #000 80%); display: flex; justify-content: center; z-index: 100;}
        .input-box-wrapper { width: 100%; max-width: 820px; display: flex; align-items: center; gap: 8px; background: rgba(20, 25, 35, 0.95); border-radius: 15px; padding: 5px; border: 1px solid var(--border); }
        input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; padding: 12px; outline: none; }
        .send-btn { background: var(--neon); color: #000; border: none; width: 45px; height: 45px; border-radius: 12px; font-size: 20px; font-weight: bold; }

        #update-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--neon); color: #000; padding: 12px 20px; border-radius: 0 0 15px 15px; font-weight: bold; z-index: 9999; transition: top 0.5s ease; display: flex; align-items: center; gap: 10px; }
        #update-toast.show { top: 0; }
    </style>
</head>
<body>
    <div id="update-toast"><span>🚀 يوجد تحديث!</span><button onclick="applyUpdate()">تحديث</button></div>
    
    <div class="header">
        <div class="header-title"><div class="main">M.E SEARCH</div></div>
        <button onclick="newChat()" style="background:transparent; border:1px solid var(--neon); color:var(--neon); padding:6px 12px; border-radius:10px; font-size:13px;">+ NEW</button>
    </div>
    
    <div class="chat-wrapper" id="chat-wrapper">
        <div class="chat-container" id="chat-container"></div>
    </div>
    
    <div class="input-container">
        <div class="input-box-wrapper">
            <input type="text" id="prompt" placeholder="ابحث عن أي شيء..." onkeypress="if(event.key === 'Enter') askAI()">
            <button class="send-btn" onclick="askAI()">↑</button>
        </div>
    </div>

    <script>
        // تخصيص شكل اللينكات في مكتبة marked
        const renderer = new marked.Renderer();
        renderer.link = function(href, title, text) {
            return `<a href="${href}" target="_blank" class="link-btn">🔗 ${text} <span>↗</span></a>`;
        };
        marked.setOptions({ renderer: renderer, breaks: true });

        let newWorker;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    newWorker = reg.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            document.getElementById('update-toast').classList.add('show');
                        }
                    });
                });
            });
        }
        function applyUpdate() { if (newWorker) newWorker.postMessage({ action: 'skipWaiting' }); window.location.reload(); }

        let chatHistory = JSON.parse(localStorage.getItem('m.e_history')) || [];

        function loadHistory() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            if(chatHistory.length === 0) {
                container.innerHTML = `<div class="message-row ai"><div class="message-content">مرحباً يا محمد 👋<br>أنا محرك البحث الخاص بك. اسألني عن أي حاجة.</div></div>`;
            }
            chatHistory.forEach((msg, index) => {
                let htmlContent = marked.parse(msg.content);
                let copyBtn = msg.role === 'ai' ? `<button class="copy-btn" onclick="copyText(${index})">📋 نسخ التقرير</button>` : '';
                
                container.innerHTML += `
                    <div class="message-row ${msg.role === 'user' ? 'user' : 'ai'}">
                        <div class="message-content" id="msg-${index}">${htmlContent}</div>
                        ${copyBtn}
                    </div>`;
            });
            document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;
        }
        loadHistory();

        function copyText(index) {
            navigator.clipboard.writeText(chatHistory[index].content).then(() => alert('تم النسخ!'));
        }

        function newChat() { chatHistory = []; localStorage.removeItem('m.e_history'); loadHistory(); }

        // 🚨 دالة الكتابة السريعة (Typing Effect) 🚨
        async function typeWriter(element, text, speed = 10) {
            element.innerHTML = '';
            const lines = text.split('\n');
            let currentText = '';
            
            for (let i = 0; i < lines.length; i++) {
                currentText += lines[i] + '\n';
                // بنحول النص لشكل منسق كل ما نضيف سطر
                element.innerHTML = marked.parse(currentText);
                document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;
                // سرعة 10ms للسطر
                await new Promise(r => setTimeout(r, speed));
            }
            // التأكيد النهائي
            element.innerHTML = marked.parse(text);
        }

        async function askAI() {
            const promptInput = document.getElementById('prompt');
            const prompt = promptInput.value.trim();
            if(!prompt) return;

            const chatContainer = document.getElementById('chat-container');
            const msgId = 'user-' + Date.now();
            chatContainer.innerHTML += `<div class="message-row user"><div class="message-content">${prompt}</div></div>`;
            promptInput.value = '';
            document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `<div class="message-row ai" id="${loadingId}"><div class="message-content">⏳ جاري البحث...</div></div>`;
            document.getElementById('chat-wrapper').scrollTop = document.getElementById('chat-wrapper').scrollHeight;

            try {
                const res = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, history: chatHistory }) });
                const data = await res.json();
                
                document.getElementById(loadingId).remove();
                
                chatHistory.push({ role: 'user', content: prompt });
                chatHistory.push({ role: 'assistant', content: data.final });
                localStorage.setItem('m.e_history', JSON.stringify(chatHistory));
                
                // إنشاء فقاعة جديدة للكتابة
                const aiMsgId = 'ai-' + Date.now();
                chatContainer.innerHTML += `
                    <div class="message-row ai">
                        <div class="message-content" id="${aiMsgId}"></div>
                        <button class="copy-btn" onclick="copyText(${chatHistory.length - 1})">📋 نسخ التقرير</button>
                    </div>`;
                
                // تشغيل الكتابة السريعة (10ms)
                await typeWriter(document.getElementById(aiMsgId), data.final, 10);

            } catch (error) {
                document.getElementById(loadingId).remove();
                alert('السيرفر لسه بيصحى. استنى شوية وجرب.');
            }
        }
    </script>
</body>
</html>
